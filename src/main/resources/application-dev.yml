# ── Dev profile — runs on your Mac, connects to localhost ─────────────────────
# Active automatically when SPRING_PROFILES_ACTIVE is not set.
# Passwords fall back to defaults so IntelliJ Just Works without a .env file.

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/financeTracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}

minio:
  endpoint: http://localhost:9000
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  # Rewrite presigned URLs to this public URL so Android can reach MinIO via ngrok→nginx.
  # Update this whenever your ngrok URL changes.
  public-url: ${MINIO_PUBLIC_URL:https://nontoxically-unhumiliating-shoshana.ngrok-free.dev}

jwt:
  secret: ${JWT_SECRET}

google:
  client-id: ${GOOGLE_CLIENT_ID:180806298382-q7ofrc16oqep2k7jsd5budl10o1qkqn6.apps.googleusercontent.com}
