# ── Common config (both dev and prod) ────────────────────────────────────────
# Secrets are NEVER hardcoded here — they come from environment variables.
# Dev  profile: application-dev.yml  (uses localhost, has safe defaults)
# Prod profile: application-prod.yml (uses Docker service names, requires .env)

spring:
  profiles:
    active: dev    # default to dev locally; Docker overrides this with SPRING_PROFILES_ACTIVE=prod
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  hikari:
    maximum-pool-size: 20
    minimum-idle: 5
    idle-timeout: 600000
    connection-timeout: 30000

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.z.finance.tracker.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000   # 24 hours

server:
  port: 8080

minio:
  bucket: finance-tracker

google:
  client-id: ${GOOGLE_CLIENT_ID}

