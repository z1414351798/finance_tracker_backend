# ── Prod profile — runs inside Docker Compose ─────────────────────────────────
# Service names (mysql, redis, minio) are Docker Compose service names.
# All values MUST come from environment variables — no defaults here.

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/financeTracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}

