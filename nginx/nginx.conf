events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Redirect HTTP → HTTPS (both root and www) ──────────────────────────────
    server {
        listen 80;
        server_name wisefintrakr.com www.wisefintrakr.com;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ──────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name wisefintrakr.com www.wisefintrakr.com;

        # Let's Encrypt certificates (mounted from host /etc/letsencrypt)
        ssl_certificate     /etc/letsencrypt/live/www.wisefintrakr.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.wisefintrakr.com/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── React Frontend ─────────────────────────────────────────────────────
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Spring Boot API ────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 10M;
            proxy_read_timeout    300s;
            proxy_connect_timeout 300s;
        }

        # ── MinIO presigned URL proxy ──────────────────────────────────────────
        location /finance-tracker/ {
            proxy_pass http://minio:9000/finance-tracker/;
            proxy_set_header Host              "minio:9000";
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_pass_request_headers on;
        }

        location /test {
            return 200 "NGINX OK (HTTPS)";
        }
    }
}
