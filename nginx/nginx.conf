events {}

http {
    # ── Redirect all HTTP → HTTPS ──────────────────────────────────────────────
    server {
        listen 80;
        server_name yourdomain.com;   # ← replace with your actual domain
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ──────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name yourdomain.com;   # ← replace with your actual domain

        # Let's Encrypt certificates (auto-renewed)
        ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Spring Boot API ────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header ngrok-skip-browser-warning "true";
            client_max_body_size 10M;
            proxy_read_timeout    300s;
            proxy_connect_timeout 300s;
        }

        # ── MinIO presigned URL proxy ──────────────────────────────────────────
        # Android loads presigned images directly: client → nginx → MinIO (no Spring).
        # Host forced to "minio:9000" to match what the backend signed.
        location /finance-tracker/ {
            proxy_pass http://minio:9000/finance-tracker/;
            proxy_set_header Host "minio:9000";
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_pass_request_headers on;
        }

        location /test {
            return 200 "NGINX OK (HTTPS)";
        }
    }
}
