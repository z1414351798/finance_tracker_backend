networks:
  finance-net:
    driver: bridge

volumes:
  mysql-data:
  minio-data:
  redis-data:

services:

  # ── MySQL ──────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0.44
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: financeTracker
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql   # runs only on first start
    networks:
      - finance-net
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:8.4.0
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - finance-net
    restart: always

  # ── MinIO ──────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address :9001
    volumes:
      - minio-data:/data
    ports:
      - "9001:9001"   # MinIO web console (internal only — do NOT expose to internet)
    networks:
      - finance-net
    restart: always

  # ── Spring Boot Backend ────────────────────────────────────────────────────
  backend:
    image: hoyi9749/finance-tracker-backend:latest
    container_name: finance-tracker
    volumes:
      - /opt/finance-tracker/logs:/app/logs
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_PASSWORD:    ${MYSQL_PASSWORD}
      REDIS_PASSWORD:    ${REDIS_PASSWORD}
      MINIO_ACCESS_KEY:  ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY:  ${MINIO_SECRET_KEY}
      JWT_SECRET:        ${JWT_SECRET}
      MINIO_PUBLIC_URL:  ${MINIO_PUBLIC_URL}
      GOOGLE_CLIENT_ID:  ${GOOGLE_CLIENT_ID}
    depends_on:
      mysql:
        condition: service_healthy   # wait for MySQL to be ready
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - finance-net
    restart: always

  # ── nginx (HTTPS reverse proxy) ────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"     # redirects to 443
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /opt/finance-tracker/frontend:/usr/share/nginx/html:ro   # Let's Encrypt certs
    depends_on:
      - backend
    networks:
      - finance-net
    restart: always
